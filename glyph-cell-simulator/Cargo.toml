[package]
name = "glyph-cell-simulator"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "PC simulator for previewing glyph-cell text layout"
publish = false

[dependencies]
embedded-graphics-core = "0.4"
freetype = "0.8"
glyph-cell = { path = "../glyph-cell", features = ["debug"] }
serde = { version = "1", features = ["derive"] }
tauri = "2"

[build-dependencies]
tauri-build = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Controls_Dialogs"] }
